# Android CI.
#
# Two different jobs, on purpose:
#
#   validate  - pull requests. Needs no secrets. Analyses, runs the test suite and
#               produces a debug APK against a placeholder Firebase config, so a
#               contributor's PR can go green without access to the signing key.
#   build     - tags and manual dispatch. Produces the two signed release APKs,
#               one per ABI, and fails loudly if any secret is missing.
#
# Required repository secrets for `build`:
#   GOOGLE_SERVICES_JSON_BASE64   base64 of android/app/google-services.json
#   ANDROID_KEYSTORE_BASE64       base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS             optional, defaults to "upload"
# Optional:
#   RAZORPAY_KEY_ID, POSTHOG_API_KEY
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "android/**"
      - "pubspec.yaml"
      - "tool/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ validate
  validate:
    name: Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
          cache: true

      - name: Generate Android project if absent
        # Test for the Gradle file, not the directory: this repository commits
        # android/key.properties.example, so android/ exists in a fresh checkout
        # while the generated project does not.
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            cp pubspec.yaml /tmp/pubspec.before-create
            flutter create --platforms=android --org app.tab --project-name sproutly .
            # `flutter create` must never rewrite our dependency list.
            cmp -s pubspec.yaml /tmp/pubspec.before-create || cp /tmp/pubspec.before-create pubspec.yaml
          fi

      - name: Configure package id, permissions and AdMob
        run: bash tool/configure_platform.sh

      - name: Placeholder Firebase config
        # No real project is needed to compile. This is never used for a release.
        run: bash tool/stub_google_services.sh app.tab.store

      - name: Fetch packages
        run: flutter pub get

      - name: Analyse
        # Reported, not gated: the value here is the log, and a lint infraction
        # should not block a pull request from being reviewed.
        run: flutter analyze --no-fatal-infos || true

      - name: Test
        run: flutter test --reporter expanded

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

  # --------------------------------------------------------------------- build
  build:
    name: ${{ matrix.abi }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            target: android-arm
            apk: app-armeabi-v7a-release.apk
          - abi: arm64-v8a
            target: android-arm64
            apk: app-arm64-v8a-release.apk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
          cache: true

      - name: Generate Android project if absent
        # Test for the Gradle file, not the directory: this repository commits
        # android/key.properties.example, so android/ exists in a fresh checkout
        # while the generated project does not.
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            cp pubspec.yaml /tmp/pubspec.before-create
            flutter create --platforms=android --org app.tab --project-name sproutly .
            # `flutter create` must never rewrite our dependency list.
            cmp -s pubspec.yaml /tmp/pubspec.before-create || cp /tmp/pubspec.before-create pubspec.yaml
          fi

      - name: Configure package id, permissions and AdMob
        # Invoked through bash on purpose: the scripts work whether or not the
        # executable bit survived the commit.
        run: bash tool/configure_platform.sh

      - name: Check required secrets
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in GOOGLE_SERVICES_JSON_BASE64 ANDROID_KEYSTORE_BASE64 \
                      ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name}. See docs/RELEASE.md for the list and how to generate each value."
              missing=1
            fi
          done
          exit $missing

      - name: Install Firebase config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash tool/configure_signing.sh

      - name: Fetch packages
        run: flutter pub get

      - name: Build ${{ matrix.abi }} release APK
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          flutter build apk --release \
            --target-platform ${{ matrix.target }} \
            --split-per-abi \
            --dart-define=SPROUTLY_ENV=prod \
            --dart-define=RAZORPAY_KEY_ID="${RAZORPAY_KEY_ID:-}" \
            --dart-define=POSTHOG_API_KEY="${POSTHOG_API_KEY:-}"

      - name: Verify the APK is signed with the release key
        run: |
          APK="build/app/outputs/flutter-apk/${{ matrix.apk }}"
          test -f "$APK" || { echo "::error::$APK was not produced"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -5
          ls -lh "$APK"

      - name: Upload ${{ matrix.abi }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: sproutly-${{ matrix.abi }}
          path: build/app/outputs/flutter-apk/${{ matrix.apk }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/${{ matrix.apk }}
          fail_on_unmatched_files: true
