name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build for device (no signing)
        working-directory: ios
        run: |
          xcodebuild \
            -project Sproutly.xcodeproj \
            -scheme Sproutly \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into an .ipa
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/Sproutly.app"
          test -d "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry Sproutly-unsigned.ipa Payload
          ls -lh Sproutly-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: sproutly-ios-ipa
          path: ios/out/Sproutly-unsigned.ipa
