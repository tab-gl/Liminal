# Native Kotlin/Compose app (app-kotlin/).
#
# Separate from the Flutter workflow on purpose: the two builds are independent
# while the rewrite is in progress, and a failure in one should not mask the
# other.
#
# The repository ships no Gradle wrapper, so CI provisions Gradle through
# gradle/actions/setup-gradle. Run `gradle wrapper` once locally if you want
# ./gradlew in the repo.
name: Android Native

on:
  push:
    # Every push to main that touches the native app, plus release tags. Main
    # should never sit unverified.
    branches: ["main"]
    tags: ["v*-native"]
    paths:
      - "app-kotlin/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "app-kotlin/**"
      - ".github/workflows/android-native.yml"

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check the Firebase config is present
        run: python3 app-kotlin/tool/check_firebase_config.py

      - name: Assemble debug
        working-directory: app-kotlin
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sproutly-native-debug
          path: app-kotlin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Release ${{ matrix.abi }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            apk: app-armeabi-v7a-release.apk
          - abi: arm64-v8a
            apk: app-arm64-v8a-release.apk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name}. See docs/RELEASE.md."
              missing=1
            fi
          done
          exit $missing

      - name: Install keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app-kotlin/upload-keystore.jks
          chmod 600 app-kotlin/upload-keystore.jks

      - name: Assemble release
        working-directory: app-kotlin
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify the signature
        run: |
          APK=$(ls app-kotlin/app/build/outputs/apk/release/*${{ matrix.abi }}*.apk | head -1)
          test -n "$APK" || { echo "::error::no APK for ${{ matrix.abi }}"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -5
          ls -lh "$APK"

      - name: Upload ${{ matrix.abi }}
        uses: actions/upload-artifact@v4
        with:
          name: sproutly-native-${{ matrix.abi }}
          path: app-kotlin/app/build/outputs/apk/release/*${{ matrix.abi }}*.apk
          if-no-files-found: error
