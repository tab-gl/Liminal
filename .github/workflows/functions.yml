name: Cloud Functions

on:
  push:
    branches: [main]
    paths: ["functions/**", "firestore.rules", "firestore.indexes.json", "firebase.json"]
  pull_request:
    paths: ["functions/**"]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy functions, rules and indexes
        run: |
          cd functions && npm ci && npm run build && cd ..
          firebase deploy --project "${{ vars.FIREBASE_PROJECT_ID }}" \
            --only functions,firestore:rules,firestore:indexes --non-interactive
