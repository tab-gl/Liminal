# Backend CI: Cloud Functions, Firestore rules, Storage rules and indexes.
#
# Runs on every push to main and every pull request that touches the backend,
# so a billing or security-rule change can never merge unverified.
name: Backend

on:
  push:
    branches: ["main"]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - "test/rules/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - "firebase.json"
      - "test/rules/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Functions (build + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - name: Type-check, build and unit test
        run: npm test

  emulator:
    name: Emulator (rules + billing transactions)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          npm ci --prefix functions
          npm install --prefix test/rules
      - name: Firestore and Storage rules tests
        working-directory: test/rules
        run: npm test
      - name: Billing and ad-delivery transaction tests
        working-directory: functions
        run: npm run test:emulator
