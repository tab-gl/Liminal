name: sproutly
description: "Sproutly - publish it. Discover it. Grow it."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Design system. Flutter 3.47 moved Material out of the SDK; Material 3
  # Expressive ships as a package on top of it.
  material_ui: ^1.9.0
  material_3_expressive: ^1.2.0

  # State + navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  cloud_functions: ^7.0.1
  firebase_messaging: ^17.0.1
  firebase_app_check: ^0.5.1
  firebase_crashlytics: ^6.0.1
  firebase_analytics: ^13.0.1
  firebase_remote_config: ^7.0.1

  # Native integrations
  image_picker: ^1.2.4
  # In-app install: hand a downloaded APK to the system package installer.
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  app_links: ^7.2.2
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  connectivity_plus: ^7.3.2

  # Monetisation
  google_mobile_ads: ^9.2.0

  # Payments
  razorpay_flutter: ^1.4.7

  # Icons
  hugeicons: ^4.4.0

  # Presentation
  cached_network_image: ^4.0.6
  fl_chart: ^1.3.0
  shimmer: ^4.0.0
  intl: ^0.20.3
  timeago: ^3.7.1
  uuid: ^4.6.0
  collection: ^1.19.0

  # Optional product analytics (disabled unless a key is configured)
  posthog_flutter: ^5.58.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    # DM Sans, variable (opsz 9-40, wght 100-1000). One file covers every
    # weight; the type scale selects instances through FontVariation.
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
